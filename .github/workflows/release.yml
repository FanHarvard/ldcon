name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install build twine pytest detect-secrets
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FanHarvard/experiment-core
          ref: v0.1.0
          path: .core-dependency
      - run: python -m pip install ./.core-dependency
      - run: npm install --ignore-scripts
      - run: python -m build
      - run: python scripts/check_tag.py
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_dist.py dist
      - run: python scripts/check_secrets.py
      - run: python scripts/install_wheel.py
      - run: python -m pytest -q
      - run: node tests/test_dlc_adjustment_web.cjs
      - run: python -m pip check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ldcon
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
