name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine pytest detect-secrets
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FanHarvard/experiment-core
          ref: v0.1.0
          path: .core-dependency
      - run: python -m pip install ./.core-dependency
      - run: npm install --ignore-scripts
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_dist.py dist
      - run: python scripts/check_secrets.py
      - run: python scripts/install_wheel.py
      - run: python -m pytest -q
      - run: python -m pip check
