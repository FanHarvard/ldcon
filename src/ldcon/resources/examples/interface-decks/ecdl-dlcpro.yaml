# Illustrative configuration only; hardware output is disabled.
schema_version: 1
id: ecdl-dlcpro
name: ThF685 / DLC Pro
interfaces:
  observation: optical_mode_monitor
  axis: bounded_axis
  loop: open_loop_state
  dlc_lock: dlcpro_frequency_control
  wavelength: frequency_monitor
cards:
- id: pzt-frequency-calibration
  operation: identify.axis_frequency
  uses:
  - observation
  - axis
  - loop
  parameters:
    offsets:
    - -0.1
    - 0
    - 0.1
    repeats: 2
    samples_per_point: 5
    settle_s: 0.2
    sample_interval_s: 0.05
    max_sample_age_s: 0.2
    timeout_s: 120
    point_timeout_s: 10
    max_discontinuity_hz: 1000000000
    max_fit_residual_hz: 10000000
    max_hysteresis_hz: 20000000
    min_signal_hz: 1000000
    require_single_mode: false
    quality_limits: {}
    restore_origin: true
    write_report: true
- id: steady-lock
  operation: servo.dlcpro_frequency
  uses:
  - dlc_lock
  parameters:
    target_frequency_hz: null
    duration_s: 86400
    sample_interval_s: 0.1
    kp: 0.3
    ki_per_s: 0.5
    integral_limit_v: 1
    capture_hz: 100000000
    tolerance_hz: 10000000
    tec_gain: 0.1
    tec_period_s: 10
    pzt_center_v: null
- id: observe
  operation: measure.change
  uses: []
  parameters:
    changes: []
    apply_mode: ordered
    measurements:
      wavelength: true
      optical_quality: false
      dither: false
    baseline_s: 2.0
    wait_s: 0.0
    duration_s: 10.0
    history_wait_s: 2.0
    minimum_samples: 3
    sample_interval_s: 0.1
    measurement_max_age_s: 2.0
    max_sample_gap_s: 1.0
    timeout_s: 300.0
- id: current-response
  operation: measure.change
  uses: []
  parameters:
    changes: []
    apply_mode: ordered
    measurements:
      wavelength: true
      optical_quality: true
      dither: false
    baseline_s: 2.0
    wait_s: 0.0
    duration_s: 10.0
    history_wait_s: 2.0
    minimum_samples: 3
    sample_interval_s: 0.1
    measurement_max_age_s: 2.0
    max_sample_gap_s: 1.0
    timeout_s: 300.0
- id: temperature-response
  operation: measure.change
  uses: []
  parameters:
    changes: []
    apply_mode: ordered
    measurements:
      wavelength: true
      optical_quality: false
      dither: false
    baseline_s: 2.0
    wait_s: 0.0
    duration_s: 10.0
    history_wait_s: 2.0
    minimum_samples: 3
    sample_interval_s: 0.1
    measurement_max_age_s: 2.0
    max_sample_gap_s: 1.0
    timeout_s: 300.0
- id: piezo-response
  operation: measure.change
  uses: []
  parameters:
    changes: []
    apply_mode: ordered
    measurements:
      wavelength: true
      optical_quality: false
      dither: false
    baseline_s: 2.0
    wait_s: 0.0
    duration_s: 10.0
    history_wait_s: 2.0
    minimum_samples: 3
    sample_interval_s: 0.1
    measurement_max_age_s: 2.0
    max_sample_gap_s: 1.0
    timeout_s: 300.0
- id: piezo-current-feedforward
  operation: measure.change
  uses: []
  parameters:
    changes: []
    apply_mode: ordered
    measurements:
      wavelength: true
      optical_quality: true
      dither: false
    baseline_s: 2.0
    wait_s: 0.0
    duration_s: 10.0
    history_wait_s: 2.0
    minimum_samples: 3
    sample_interval_s: 0.1
    measurement_max_age_s: 2.0
    max_sample_gap_s: 1.0
    timeout_s: 300.0
- id: batch-measurement
  operation: measure.batch
  uses: []
  parameters:
    steps: []
    timeout_s: 3600.0
- id: gateway-agent
  operation: agent.resident
  uses: []
  parameters:
    provider: claude
    mode: create_or_connect
    workspace: ''
    session_id: ''
- id: pi-observation
  operation: measure.change
  uses: []
  parameters:
    changes: []
    apply_mode: atomic
    measurements:
      wavelength: true
      optical_quality: false
      dither: false
    baseline_s: 0.0
    wait_s: 5.0
    duration_s: 60.0
    history_wait_s: 0.0
    minimum_samples: 100
    sample_interval_s: 0.1
    measurement_max_age_s: 2.0
    max_sample_gap_s: 1.0
    timeout_s: 90.0
- id: pi-optimization
  operation: agent.task
  uses: []
  parameters:
    agent_card_id: gateway-agent
    instruction_profile: adjustment
    adjustment_family: pi
    adjustment_plan_card_id: pi-observation
    timeout_s: 1800.0
    adoption_mode: auto_within_approved
    prompt: REPLACE_WITH_LOCAL_CONFIGURATION
  agent_execution:
    mode: required
    difficulty: deep
    escalation_profiles: []
- id: target-response-pi-measurements
  operation: measure.batch
  uses: []
  parameters:
    steps:
    - changes: []
      apply_mode: atomic
      measurements:
        wavelength: true
        optical_quality: false
        dither: false
      baseline_s: 0.0
      wait_s: 0.0
      duration_s: 60.0
      history_wait_s: 0.0
      minimum_samples: 100
      sample_interval_s: 0.1
      measurement_max_age_s: 2.0
      max_sample_gap_s: 1.0
      timeout_s: 90.0
    - changes:
      - parameter: target_frequency_hz
        offset: 100000000.0
      apply_mode: atomic
      measurements:
        wavelength: true
        optical_quality: false
        dither: false
      baseline_s: 1.0
      wait_s: 0.0
      duration_s: 10.0
      history_wait_s: 0.0
      minimum_samples: 100
      sample_interval_s: 0.1
      measurement_max_age_s: 2.0
      max_sample_gap_s: 1.0
      timeout_s: 40.0
    - changes:
      - parameter: target_frequency_hz
        offset: -100000000.0
      apply_mode: atomic
      measurements:
        wavelength: true
        optical_quality: false
        dither: false
      baseline_s: 1.0
      wait_s: 0.0
      duration_s: 10.0
      history_wait_s: 0.0
      minimum_samples: 100
      sample_interval_s: 0.1
      measurement_max_age_s: 2.0
      max_sample_gap_s: 1.0
      timeout_s: 40.0
    - changes: []
      apply_mode: atomic
      measurements:
        wavelength: true
        optical_quality: false
        dither: false
      baseline_s: 0.0
      wait_s: 0.0
      duration_s: 60.0
      history_wait_s: 0.0
      minimum_samples: 100
      sample_interval_s: 0.1
      measurement_max_age_s: 2.0
      max_sample_gap_s: 1.0
      timeout_s: 90.0
    timeout_s: 180.0
- id: target-response-pi-optimization
  operation: agent.task
  uses: []
  parameters:
    agent_card_id: gateway-agent
    instruction_profile: adjustment
    adjustment_family: pi
    adjustment_plan_card_id: target-response-pi-measurements
    timeout_s: 1200.0
    adoption_mode: auto_within_approved
    prompt: REPLACE_WITH_LOCAL_CONFIGURATION
  agent_execution:
    mode: required
    difficulty: deep
    escalation_profiles: []
- id: frequency-staircase
  operation: sweep.dlcpro_awg
  uses: []
  parameters:
    shot_sweep: null
    pzt_ff_gain_scale: 1.0
    sample_interval_s: 0.05
