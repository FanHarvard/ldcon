<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 96 96" fill="none">
  <title>LDCon: a laser diode with agent-guided feedback</title>
  <rect width="96" height="96" rx="18" fill="#f8fafc"/>
  <g stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Laser diode and its emitted beam. -->
    <rect x="10" y="15" width="38" height="31" rx="6" fill="white"/>
    <path d="M15 31h7m0-8v16l13-8-13-8m13 0v16m0-8h7"/>
    <path d="M29 20l5-5m-1 0h1v1M38 22l5-5m-1 0h1v1" stroke="#dc2626" stroke-width="2"/>
    <path d="M48 31h35m-7-7 7 7-7 7" stroke="#dc2626"/>
    <!-- Feedback returns through the agent to the diode. -->
    <path d="M78 43v20a8 8 0 0 1-8 8h-7M33 71H24a8 8 0 0 1-8-8v-9m-5 5 5-5 5 5"/>
    <path d="M48 57v-5"/>
    <circle cx="48" cy="50" r="2.5" fill="white"/>
    <rect x="33" y="58" width="30" height="26" rx="6" fill="white"/>
    <path d="M29 67v8m38-8v8" stroke-width="2.5"/>
    <circle cx="42" cy="68" r="2" fill="#334155" stroke="none"/>
    <circle cx="54" cy="68" r="2" fill="#334155" stroke="none"/>
    <path d="M43 76h10" stroke-width="2.5"/>
  </g>
</svg>
