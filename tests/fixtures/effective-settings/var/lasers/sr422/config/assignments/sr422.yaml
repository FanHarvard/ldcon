      prompt: Teams notifications are disabled. Do not post or enqueue Teams messages.
        Use current owner and recorded evidence; old failure records are not authority
        to restart locks. Do not change target, absolute physical limits, slew limits,
        calibration, firmware, or persistent PI settings. Human and program foreground
        operations take priority. Use only this task background grant for automatic
        effects. If the system is healthy, explain why no adjustment is needed. Do
        not repeatedly disturb a healthy lock. Do not force observation of a multimode
        state. Use historical drift/recovery behavior to judge practical quality.
        Keep the local result concise in English, with evidence, actual outcome and
        uncertainty. Optimize the current operating point only when justified. Start
        with small measured moves; the full existing owner range is a ceiling, not
        a target jump. Measure fresh dither and position-free side peaks at every
        point. Record all explored points and keep the best practical measured point,
        even if a full window is not identified. Do not claim unobserved boundaries.
        Automatic scope now includes current, slow_loop and feedforward. Read background
        capabilities and actual runtime parameters first. For slow_loop use parameter_candidate
        with tec_gain, supervision_interval_s or piezo_center_dac; for feedforward
        use current_per_temperature. The approved bounds are TEC gain .01..5e-1, period
        1..100 s, PZT center 30000..36000 count, TEC-current FF .5..2 V/V. Current/TEC
        excursion ceilings are 20/10 mV per intervention; the owner publishes a tighter
        effective return envelope when needed for the unchanged 20 s foreground deadline.
        Never treat a bound as a target jump. tec_dt_cap_s is not a tuning candidate.
        The worker requires four actual slow cycles plus fresh distinct native/optical
        evidence; a long period may need several minutes. For slow-loop/feedforward
        identification only, missing thermal excitation or invalid optical observations
        make that comparison inconclusive; do not force motion to obtain excitation.
        Current-family optical-quality limits may be revised after repeated best-practical
        review; they are not physical safety bounds. Select a family justified by
        evidence; do not keep repeating a rejected trial. Save no candidate into persistent
        calibration/PI settings. Foreground operations preempt and restore this intervention
        checkpoint; never restore an old target. Teams remains disabled.
