schema_version: 1
id: ecdl-pzt-ldc-tec
name: ECDL ; PZT/LDC/TEC
interfaces:
  servo_modulation: servo_modulation
  observation: optical_mode_monitor
  piezo: bounded_axis
  temperature: bounded_axis
  current: bounded_axis
  loop: open_loop_state
  lock: ecdl_stationary_lock
cards:
- id: mode-map
  operation: study.ecdl_mode_map
  uses:
  - observation
  - piezo
  - temperature
  - current
  - loop
  parameters: {}
- id: tec-branch-alignment
  operation: tune.ecdl_operating_point
  uses:
  - observation
  - piezo
  - temperature
  - current
  - loop
  parameters: {}
- id: steady-lock
  operation: servo.ecdl_steady_lock
  uses:
  - lock
  parameters:
    strategy: hold
    duration_s: null
- id: frequency-triangle
  operation: sweep.servo_modulation
  uses:
  - servo_modulation
  parameters:
    shape: triangle
    levels_hz:
    - -1000000
    - 1000000
    dwell_s: 0.1
    sample_rate_hz: 20000
    duration_s: 600
- id: frequency-staircase
  operation: sweep.servo_modulation
  uses:
  - servo_modulation
  parameters:
    shape: staircase
    levels_hz:
    - -1000000
    - 1000000
    dwell_s: 0.1
    sample_rate_hz: 20000
    duration_s: 600
- id: teams-notification
  operation: notify.teams
  uses: []
  parameters:
    webhook_env: ''
    message: LDCon notification
- id: observe
  operation: measure.change
  uses: []
  parameters:
    changes: []
    apply_mode: ordered
    measurements:
      wavelength: true
      optical_quality: false
      dither: false
    baseline_s: 2.0
    wait_s: 0.0
    duration_s: 10.0
    history_wait_s: 2.0
    minimum_samples: 3
    sample_interval_s: 0.1
    measurement_max_age_s: 2.0
    max_sample_gap_s: 1.0
    timeout_s: 300.0
- id: current-response
  operation: measure.change
  uses: []
  parameters:
    changes: []
    apply_mode: ordered
    measurements:
      wavelength: true
      optical_quality: true
      dither: false
    baseline_s: 2.0
    wait_s: 0.0
