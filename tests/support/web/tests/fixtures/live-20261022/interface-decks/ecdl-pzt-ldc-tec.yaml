schema_version: 1
id: ecdl-pzt-ldc-tec
name: ECDL ; PZT/LDC/TEC
interfaces:
  servo_modulation: servo_modulation
  observation: optical_mode_monitor
  piezo: bounded_axis
  temperature: bounded_axis
  current: bounded_axis
  loop: open_loop_state
  lock: ecdl_stationary_lock
cards:
- id: mode-map
  operation: study.ecdl_mode_map
  uses:
  - observation
  - piezo
  - temperature
  - current
  - loop
  parameters: {}
- id: recovery-plan
  operation: plan.ecdl_recovery
  uses: []
  parameters: {}
- id: recovery-test
  operation: test.ecdl_recovery
  uses:
  - observation
  - piezo
  - temperature
  - current
  - loop
  parameters: {}
- id: operating-point
  operation: tune.ecdl_operating_point
  uses:
  - observation
  - piezo
  - temperature
  - current
  - loop
  parameters: {}
- id: pi-commission
  operation: commission.ecdl_pi
  uses:
  - lock
  parameters: {}
- id: steady-lock
  operation: servo.ecdl_steady_lock
  uses:
  - lock
  parameters:
    strategy: hold
    duration_s: null
- id: online-pid
  operation: tune.pid_online
  uses: []
  parameters:
    controller_card_id: steady-lock
    window_s: 20.0
    min_samples: 15
    timeout_s: 300.0
    gain_factors:
    - 0.5
    minimum_improvement: 0.1
    save_settings: true
- id: grafana-dashboard
  operation: report.grafana_dashboard
  uses: []
  parameters: {}
- id: window-center
  operation: tune.ecdl_window_center
  uses:
  - lock
  parameters:
    controller_card_id: steady-lock
    mode: center_only
    observables:
    - dither_response
    - metrics.side_peak_prominence_max
    - metrics.side_peak_height_max
    - metrics.main_fwhm_fraction
    timeout_s: 3600.0
- id: frequency-triangle
  operation: sweep.servo_modulation
  uses:
  - servo_modulation
  parameters:
    shape: triangle
    levels_hz:
    - -1000000
    - 1000000
    dwell_s: 0.1
    sample_rate_hz: 20000
    duration_s: 600
- id: frequency-staircase
  operation: sweep.servo_modulation
  uses:
  - servo_modulation
  parameters:
    shape: staircase
    levels_hz:
    - -1000000
    - 1000000
    dwell_s: 0.1
    sample_rate_hz: 20000
    duration_s: 600
- id: diagnostic-agent
  operation: agent.resident
  uses: []
  parameters:
    provider: claude
    mode: create_or_connect
    workspace: ''
    session_id: ''
- id: agent-log-watch
  operation: agent.log_watch
  uses: []
  parameters:
    agent_card_id: diagnostic-agent
    interval_s: 300
    lookback_s: 600
    sample_interval_s: 1
    prompt: ''
- id: agent-request
  operation: agent.request
  uses: []
  parameters:
    agent_card_id: diagnostic-agent
    prompt: ''
- id: teams-notification
  operation: notify.teams
  uses: []
  parameters:
    webhook_env: ''
    message: LDCon notification
- id: change-operating-point
  operation: tune.operating_point
  uses: []
  parameters: {}
- id: change-target
  operation: tune.lock_target
  uses: []
  parameters: {}
